[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uflow"
version = "0.1.0-dev"
description = "uFlow workflow engine package for uCore extension routing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["uflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
